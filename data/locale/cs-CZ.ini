PTZ.CameraReport.Intro="Tím se kamera zeptá, co má, a každé její nastavení se jí pošle zpět beze změny, což nic nemění a kameru to nepohybuje. Zpráva zůstane v tomto počítači. Obsahuje značku, model a verzi firmwaru kamery a její odpovědi, ale ne její adresu, ID, které jste jí dali, ani nic o vás. Chcete-li, aby doplněk lépe podporoval vaši kameru, zprávu si prohlédněte a odešlete ji na GitHub tlačítkem Otevřít stránku hlášení."
