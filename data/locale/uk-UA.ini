PTZ.CameraReport.Title="Звіт про камеру"
PTZ.CameraReport.Intro="Камері ставиться запитання, що в неї є, і кожне її налаштування надсилається їй назад як є: нічого не змінюється, камера не рухається. Звіт залишається на цьому комп’ютері. У ньому вказано марку, модель і версію прошивки камери та її відповіді, але немає її адреси, заданого вами ID чи будь-яких відомостей про вас. Якщо хочете, щоб плагін краще підтримував вашу камеру, перегляньте звіт і надішліть його на GitHub через «Відкрити сторінку звернень»."
