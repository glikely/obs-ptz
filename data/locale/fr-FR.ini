PTZ.CameraReport.Title="Rapport de caméra"
PTZ.CameraReport.Intro="Cela demande à la caméra ce dont elle dispose et lui renvoie chacun de ses réglages tel quel, ce qui ne change rien et ne la déplace pas. Le rapport reste sur cet ordinateur. Il contient la marque, le modèle et la version du micrologiciel de la caméra ainsi que ses réponses, mais pas son adresse, l'ID que vous lui avez donné ni quoi que ce soit sur vous. Si vous souhaitez que le plugin prenne mieux en charge votre caméra, relisez le rapport, puis envoyez-le sur GitHub avec Ouvrir la page du ticket."
