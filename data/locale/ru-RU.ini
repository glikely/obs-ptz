PTZ.CameraReport.Intro="Камере задаётся вопрос, что у неё есть, и каждая её настройка отправляется обратно как есть: ничего не меняется, камера не движется. Отчёт остаётся на этом компьютере. В нём указаны марка, модель и версия прошивки камеры, а также её ответы, но нет её адреса, заданного вами ID и каких-либо сведений о вас. Если хотите, чтобы плагин лучше поддерживал вашу камеру, просмотрите отчёт и отправьте его на GitHub через «Открыть страницу задач»."
