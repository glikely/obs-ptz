PTZ.CameraReport.Intro="Hiermee wordt de camera gevraagd wat hij heeft en worden al zijn instellingen ongewijzigd naar hem teruggestuurd, wat niets verandert en hem niet beweegt. Het rapport blijft op deze computer. Het bevat merk, model en firmwareversie van de camera en wat hij antwoordde, maar niet zijn adres, de ID die u hem gaf of iets over u. Als u wilt dat de plug-in uw camera beter ondersteunt, bekijk het rapport dan en stuur het in op GitHub met Issuepagina openen."
