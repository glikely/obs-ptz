PTZ.CameraReport.Intro="Detta frågar kameran vad den har och skickar tillbaka var och en av dess inställningar precis som de är, vilket inte ändrar något och inte flyttar den. Rapporten stannar på den här datorn. Den innehåller kamerans märke, modell och fast programvaruversion och vad den svarade, men inte dess adress, det ID du gav den eller något om dig. Om du vill att tillägget ska stödja din kamera bättre kan du granska rapporten och skicka in den på GitHub med Öppna ärendesidan."
