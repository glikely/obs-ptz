PTZ.CameraReport.Intro="Isto pergunta à câmera o que ela tem e devolve a ela cada uma de suas configurações como estão, o que não altera nada e não a move. O relatório fica neste computador. Ele contém a marca, o modelo e a versão do firmware da câmera e o que ela respondeu, mas não o endereço dela, o ID que você deu a ela nem qualquer informação sobre você. Se quiser que o plugin ofereça melhor suporte à sua câmera, revise o relatório e envie-o no GitHub com Abrir página de issues."
