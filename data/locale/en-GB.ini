PTZ.CameraReport.Title="Camera Report"
PTZ.CameraReport.Intro="This asks the camera what it has, and sends each of its settings back to it as it is, which changes nothing and doesn't move it. The report stays on this computer. It has the camera's make, model and firmware version and what it answered, but not its address, the ID you gave it, or anything about you. If you'd like the plugin to support your camera better, look the report over, then send it in on GitHub with Open Issue Page."
