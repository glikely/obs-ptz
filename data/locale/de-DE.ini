PTZ.CameraReport.Create="Kamerabericht erstellen…"
PTZ.CameraReport.Title="Kamerabericht"
PTZ.CameraReport.Intro="Dabei wird die Kamera gefragt, was sie kann, und jede ihrer Einstellungen wird unverändert an sie zurückgesendet. Das ändert nichts und bewegt die Kamera nicht. Der Bericht bleibt auf diesem Computer. Er enthält Hersteller, Modell und Firmware-Version der Kamera sowie ihre Antworten, aber nicht ihre Adresse, die von Ihnen vergebene ID oder irgendetwas über Sie. Wenn das Plugin Ihre Kamera besser unterstützen soll, prüfen Sie den Bericht und senden Sie ihn mit „Issue-Seite öffnen“ auf GitHub ein."
