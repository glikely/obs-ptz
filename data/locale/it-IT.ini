PTZ.CameraReport.Intro="Questa operazione chiede alla telecamera che cosa possiede e le rimanda ogni sua impostazione così com'è, senza modificare nulla e senza muoverla. Il rapporto resta su questo computer. Contiene marca, modello e versione del firmware della telecamera e ciò che ha risposto, ma non il suo indirizzo, l'ID che le hai dato né nulla su di te. Se vuoi che il plugin supporti meglio la tua telecamera, controlla il rapporto, poi invialo su GitHub con Apri pagina segnalazioni."
