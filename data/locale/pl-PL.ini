PTZ.CameraReport.Title="Raport kamery"
PTZ.CameraReport.Intro="Ta operacja pyta kamerę, co ma, i odsyła jej każde z jej ustawień bez zmian, co niczego nie zmienia i nie porusza kamery. Raport zostaje na tym komputerze. Zawiera markę, model i wersję oprogramowania układowego kamery oraz jej odpowiedzi, ale nie jej adres, nadany jej identyfikator ani nic o Tobie. Jeśli chcesz, aby wtyczka lepiej obsługiwała Twoją kamerę, przejrzyj raport i wyślij go na GitHub przyciskiem Otwórz stronę zgłoszeń."
