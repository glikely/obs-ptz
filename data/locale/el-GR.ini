PTZ.CameraReport.Intro="Αυτό ρωτά την κάμερα τι διαθέτει και της στέλνει πίσω κάθε ρύθμισή της όπως ακριβώς είναι, κάτι που δεν αλλάζει τίποτα και δεν την κινεί. Η αναφορά παραμένει σε αυτόν τον υπολογιστή. Περιέχει τη μάρκα, το μοντέλο και την έκδοση υλικολογισμικού της κάμερας και όσα απάντησε, αλλά όχι τη διεύθυνσή της, το ID που της δώσατε ή οτιδήποτε σχετικό με εσάς. Αν θέλετε το πρόσθετο να υποστηρίζει καλύτερα την κάμερά σας, εξετάστε την αναφορά και στείλτε την στο GitHub με το Άνοιγμα σελίδας ζητημάτων."
