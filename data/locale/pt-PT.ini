PTZ.CameraReport.Intro="Isto pergunta à câmara o que ela tem e devolve-lhe cada uma das suas definições tal como estão, o que não altera nada nem a move. O relatório fica neste computador. Contém a marca, o modelo e a versão do firmware da câmara e o que ela respondeu, mas não o seu endereço, o ID que lhe deu nem nada sobre si. Se quiser que o plugin suporte melhor a sua câmara, reveja o relatório e envie-o no GitHub com Abrir página de issues."
