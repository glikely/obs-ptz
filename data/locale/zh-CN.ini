PTZ.CameraReport.Title="摄像机报告"
PTZ.CameraReport.Intro="这会询问摄像机具备哪些功能，并将它的每项设置原样发回给它，不会更改任何内容，也不会移动摄像机。报告只保存在这台电脑上。其中包含摄像机的品牌、型号、固件版本以及它的应答，但不包含它的地址、你为它设置的 ID，也不包含任何与你有关的信息。如果你希望插件更好地支持你的摄像机，请先检查报告，然后通过“打开 Issue 页面”将其提交到 GitHub。"
