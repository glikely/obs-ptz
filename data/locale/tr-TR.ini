PTZ.CameraReport.Intro="Bu işlem kameraya neleri olduğunu sorar ve her ayarını olduğu gibi kameraya geri gönderir; hiçbir şeyi değiştirmez ve kamerayı hareket ettirmez. Rapor bu bilgisayarda kalır. Raporda kameranın markası, modeli, bellenim sürümü ve verdiği yanıtlar bulunur; ancak adresi, ona verdiğiniz kimlik veya sizinle ilgili hiçbir şey yer almaz. Eklentinin kameranızı daha iyi desteklemesini istiyorsanız raporu inceleyin, ardından Sorun Sayfasını Aç ile GitHub'a gönderin."
