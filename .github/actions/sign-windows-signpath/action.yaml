name: Sign Windows binaries with SignPath
description: Submits built Windows binaries to SignPath for Authenticode signing
inputs:
  apiToken:
    description: SignPath API token
    required: false
  organizationId:
    description: SignPath organization ID
    required: false
  signingPolicySlug:
    description: SignPath signing policy slug (test-signing or release-signing)
    required: true
  artifactConfigurationSlug:
    description: SignPath artifact configuration slug describing what to sign in the submitted files
    required: false
    default: windows-plugin
  artifactName:
    description: Name to give the unsigned/signed workflow artifacts
    required: true
  path:
    description: Directory tree containing binaries to sign (signed files overwrite in place)
    required: true
outputs:
  haveSigningCredentials:
    description: True if SignPath credentials were available
    value: ${{ steps.check.outputs.haveSigningCredentials }}
runs:
  using: composite
  steps:
    - name: Check For Signing Credentials 🔍
      id: check
      shell: pwsh
      run: |
        # Check For Signing Credentials 🔍
        $Have = ('${{ inputs.apiToken }}' -ne '') -and ('${{ inputs.organizationId }}' -ne '')
        "haveSigningCredentials=$($Have.ToString().ToLower())" >> $env:GITHUB_OUTPUT

    - name: Upload Unsigned Artifact 📤
      if: fromJSON(steps.check.outputs.haveSigningCredentials)
      id: upload-unsigned
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifactName }}-unsigned
        path: ${{ inputs.path }}
        if-no-files-found: error

    - name: Wait For Artifact To Be Listed ⏳
      if: fromJSON(steps.check.outputs.haveSigningCredentials)
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_ID: ${{ steps.upload-unsigned.outputs.artifact-id }}
        ARTIFACT_NAME: ${{ inputs.artifactName }}-unsigned
      run: |
        # Wait For Artifact To Be Listed ⏳
        # The SignPath connector finds the artifact through the GitHub API, and
        # a freshly finalized upload can take a moment to show up in the run's
        # artifact list. Submitting before then fails with "no published artifact".
        $Uri = "${env:GITHUB_API_URL}/repos/${env:GITHUB_REPOSITORY}/actions/runs/${env:GITHUB_RUN_ID}/artifacts?name=${env:ARTIFACT_NAME}&per_page=100"
        $Headers = @{ Authorization = "Bearer ${env:GH_TOKEN}"; Accept = 'application/vnd.github+json' }
        for ( $Attempt = 1; $Attempt -le 12; $Attempt++ ) {
          try {
            $Listed = (Invoke-RestMethod -Uri $Uri -Headers $Headers).artifacts.id -contains [int64]$env:ARTIFACT_ID
          } catch {
            $Listed = $false
          }
          if ( $Listed ) {
            Write-Output "Artifact ${env:ARTIFACT_ID} is listed (attempt ${Attempt})"
            return
          }
          Start-Sleep -Seconds 5
        }
        Write-Warning "Artifact ${env:ARTIFACT_ID} still not listed after 60 seconds; submitting anyway"

    - name: Submit to SignPath ✍️
      if: fromJSON(steps.check.outputs.haveSigningCredentials)
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ inputs.apiToken }}
        organization-id: ${{ inputs.organizationId }}
        project-slug: obs-ptz
        signing-policy-slug: ${{ inputs.signingPolicySlug }}
        artifact-configuration-slug: ${{ inputs.artifactConfigurationSlug }}
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: ${{ inputs.path }}-signed

    - name: Replace With Signed Binaries 🔁
      if: fromJSON(steps.check.outputs.haveSigningCredentials)
      shell: pwsh
      run: |
        # Replace With Signed Binaries 🔁
        Copy-Item -Path "${{ inputs.path }}-signed/*" -Destination "${{ inputs.path }}" -Recurse -Force
